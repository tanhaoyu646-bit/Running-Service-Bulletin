<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>纸质运行揭示生成器（批次联动教学版）</title>
<style>
  :root{--bg:#e9e9e9;--panel:#fff;--ink:#151515;--line:#ddd;--yellow:rgba(255,235,59,.62)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
  .workspace{min-height:100vh;padding:26px;display:flex;justify-content:center;align-items:flex-start;overflow:auto}
  .sheet{position:relative;width:1120px;min-height:792px;background:linear-gradient(rgba(255,255,255,.97),rgba(255,255,255,.97)),repeating-linear-gradient(0deg,#f4f1e9 0,#f4f1e9 2px,#fbfaf6 2px,#fbfaf6 4px);box-shadow:0 12px 34px rgba(0,0,0,.16);padding:62px 88px 78px;overflow:hidden}
  .paper{position:relative;z-index:2;font-family:"SimSun","Songti SC","STSong","Noto Serif CJK SC",serif}
  .title{text-align:center;font-size:44px;line-height:1.15;font-weight:500;letter-spacing:2px;margin:7px 0 68px}
  .route{text-align:center;font-size:25px;letter-spacing:2px;margin-bottom:24px}
  .meta{display:flex;justify-content:center;gap:52px;font-size:22px;line-height:1.7;white-space:nowrap;margin-bottom:68px}
  .items{font-size:27px;line-height:2.04;letter-spacing:1px}
  .item{position:relative;margin:0 0 20px;padding-left:0}
  .item-mark{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:30px;
    height:30px;
    margin-right:7px;
    cursor:pointer;
    user-select:none;
    vertical-align:middle;
    border:2px solid transparent;
    border-radius:50%;
    transform:rotate(-7deg);
  }
  .item-mark.circled{
    border-color:#1d4a80;
  }
  .item-mark.checked::after{
    content:"✓";
    position:absolute;
    left:3px;
    top:-7px;
    z-index:2;
    font-family:"KaiTi","STKaiti","Microsoft YaHei",sans-serif;
    font-size:31px;
    font-weight:700;
    line-height:1;
    color:#1d4a80;
    transform:rotate(-5deg);
    text-shadow:0 0 1px rgba(29,74,128,.15);
  }
  .item-index{
    display:inline-block;
    min-width:42px;
    vertical-align:middle;
    user-select:none;
  }
  .item-text{user-select:text;-webkit-user-select:text}
  .triangle{font-size:.94em;margin-right:3px}
  mark.student-highlight{background:var(--yellow);color:inherit;padding:0;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .watermark{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;transform:rotate(-24deg);pointer-events:none;user-select:none;font:700 52px/1 "Microsoft YaHei",sans-serif;letter-spacing:8px;white-space:nowrap;color:rgba(150,0,0,.052)}
  .badge{position:absolute;z-index:3;right:22px;top:18px;font:12px/1.2 "Microsoft YaHei",sans-serif;color:#8b8b8b;letter-spacing:1px}
  .drawer{position:fixed;z-index:20;left:0;top:0;width:232px;height:100vh;background:rgba(255,255,255,.98);border-right:1px solid var(--line);box-shadow:4px 0 16px rgba(0,0,0,.08);transform:translateX(-100%);transition:transform .22s ease;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:24px 20px}
  .drawer.open{transform:translateX(0)}
  .drawer button{width:100%;border:1px solid #bbb;background:#fff;color:#181818;border-radius:10px;padding:12px 10px;font-size:15px;cursor:pointer;letter-spacing:.5px;transition:.15s ease}
  .drawer button:hover{background:#f2f2f2}
  .drawer button.primary{border-color:#151515;background:#151515;color:#fff;font-size:16px}
  .drawer button.primary:hover{background:#303030}
  .divider{height:1px;background:#e5e5e5;margin:3px 0 2px}
  .drawer-handle{position:fixed;z-index:21;left:0;top:50%;transform:translateY(-50%);width:26px;height:76px;border:1px solid #cfcfcf;border-left:0;border-radius:0 8px 8px 0;background:rgba(255,255,255,.95);box-shadow:2px 2px 8px rgba(0,0,0,.08);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:#555;transition:left .22s ease;user-select:none}
  .drawer.open + .drawer-handle{left:232px}
  @keyframes paperRefresh{0%{opacity:.15;transform:translateY(-14px)}100%{opacity:1;transform:translateY(0)}}
  .refreshing .paper{animation:paperRefresh .22s ease-out}
  @media(max-width:1180px){.workspace{justify-content:flex-start}}
  @media print{.drawer,.drawer-handle{display:none!important}body{background:#fff}.workspace{padding:0}.sheet{width:297mm;min-height:210mm;padding:16mm 23mm 20mm;box-shadow:none}.badge{right:8mm;top:6mm}}

  .batch-panel{margin:0 0 8px;padding:10px;border:1px solid #d6d6d6;border-radius:10px;background:#fafafa}
  .batch-panel .caption{font-size:12px;color:#666;line-height:1.45;margin-bottom:7px}
  .batch-panel label{display:block;font-size:12px;color:#555;margin:7px 0 4px}
  .batch-panel input,.batch-panel select{width:100%;height:36px;border:1px solid #bbb;border-radius:7px;background:#fff;padding:0 8px;font-size:14px}
  .batch-panel button{margin-top:8px}
  .batch-status{position:absolute;z-index:4;left:22px;top:18px;font:12px/1.2 "Microsoft YaHei",sans-serif;color:#777;letter-spacing:.5px}
  .drawer-note{font-size:11px;line-height:1.5;color:#777;margin:2px 2px 7px}

</style>
</head>
<body>
  <aside class="drawer" id="drawer">
    <div class="batch-panel">
      <div class="caption"><b>批次联动训练</b><br>与教师端输入同一批次码；A/B/C 为不同学生题面。</div>
      <label for="batchCode">训练批次</label>
      <input id="batchCode" type="text" value="01" maxlength="12" autocomplete="off">
      <label for="studentVersion">学生版本</label>
      <select id="studentVersion">
        <option value="A">A｜命令号错误 + 漏项</option>
        <option value="B">B｜方向错误 + 多项</option>
        <option value="C">C｜时间错误 + 内容缺失</option>
        <option value="D">D｜完整正确（教师演示）</option>
      </select>
      <button class="primary" id="batchGenerateBtn">按批次生成交付揭示</button>
    </div>
    <div class="divider"></div>
    <button id="generateBtn">随机综合练习</button>
    <div class="drawer-note">以下为独立专项练习，不与教师端批次联动。</div>
    <button id="changeoverBtn">换装类揭示</button>
    <button id="equipmentBtn" title="出站色灯信号机故障→绿色许可证；进站停车接车→引导信号；通过车站→特定引导">设备变化类揭示</button>
    <button id="speedBtn">限速类揭示</button>
  </aside>
  <div class="drawer-handle" id="drawerHandle" title="展开 / 收起">›</div>
  <main class="workspace" id="workspace">
    <section class="sheet" id="sheet">
      <div class="watermark">教学训练模拟 · 非行车凭证</div>
      <div class="batch-status" id="batchStatus">训练批次 01 · A</div><div class="badge">教学训练模拟 · 非行车凭证</div>
      <div class="paper" id="paper">
        <div class="title">运行揭示</div>
        <div class="route" id="route"></div>
        <div class="meta" id="meta"></div>
        <div class="items" id="items"></div>
      </div>
    </section>
  </main>
<script>
const base={route:"丙站至戊站　下行",delivery:"交付日期：2021 年 1 月 1 日 0：00",valid:"有效时间至 2021 年 12 月 31 日 23：59 分",items:[{cmd:"21171",start:"2021 年 1 月 1 日 0 时 0 分",end:"2021 年 12 月 31 日 23 时 59 分",body:"通用线丙站下行出站信号机施工，丙站下行方向凭绿色许可证发车。"},{cmd:"21172",start:"2021 年 1 月 1 日 0 时 0 分",end:"2021 年 12 月 31 日 23 时 59 分",body:"通用线戊站下行进站色灯信号机故障，戊站办理停车接车时使用引导信号引导接车。"}]};
const routes=[{text:"甲站至戊站　下行",stations:["甲站","乙站","丙站","丁站","戊站"],dir:"下行"},{text:"戊站至甲站　上行",stations:["戊站","丁站","丙站","乙站","甲站"],dir:"上行"},{text:"乙站至己站　下行",stations:["乙站","丙站","丁站","戊站","己站"],dir:"下行"}];
const changeoverTemplates=[(s,d)=>`${s}${d}方向担当交路机车LKJ基础数据进行版本换装，换装后启用V2.8版数据，乘务员出勤时核对LKJ版本及对应交路数据。`,(s,d)=>`${s}${d}方向机车信号车载设备软件进行换装，换装完成后按新版本使用，出勤时核对设备版本标识。`,(s,d)=>`${s}至下一站区段LKJ车载基础数据换装，新数据启用后原版本停止使用，乘务员出勤时核对换装状态。`,(s,d)=>`${s}${d}方向列车运行监控装置相关数据文件换装，换装完成后核对数据版本、线路方向及交路范围。`];
const equipmentTemplates=[(s,d)=>`${s}${d}出站色灯信号机故障，${s}${d}方向发车时凭绿色许可证发车。`,(s,d)=>`${s}${d}进站色灯信号机故障，列车在${s}办理停车接车时使用引导信号引导接车。`,(s,d)=>`${s}${d}进站色灯信号机故障，列车在${s}办理通过时按特定引导方式通过车站。`,(s,d)=>`${s}站内轨道电路设备检修，列车通过相关区段时按现场设备状态及调度命令执行。`,(s,d)=>`${s}至下一站区间自动闭塞设备施工，区间设备状态发生变化，列车按施工期间规定的行车组织方式运行。`];
const speedTemplates=[(s,d)=>`${s}至下一站区间线路施工，自K12+300至K14+800限速45 km/h。`,(s,d)=>`${s}站${d}方向2号道岔至站界施工，列车通过施工地段限速30 km/h。`,(s,d)=>`${s}至下一站区间受恶劣天气影响，自K26+100至K31+500限速60 km/h。`,(s,d)=>`${s}${d}出站色灯信号机故障，${s}${d}方向发车时凭绿色许可证发车。`,(s,d)=>`${s}${d}进站色灯信号机故障，列车在${s}办理停车接车时使用引导信号引导接车。`,(s,d)=>`${s}至下一站长大坡道区段遇冰雪天气，按调度命令采用双机牵引方式运行。`];
const genericErrorTypes=["cmd","direction","station","time","missingWhole","missingContent"];
function deepClone(x){return JSON.parse(JSON.stringify(x))}
function rand(n){return Math.floor(Math.random()*n)}
function pick(a){return a[rand(a.length)]}
function commandNo(){return String(22000+rand(700))}
function mkTimes(){return{start:"2021 年 1 月 1 日 0 时 0 分",end:"2021 年 12 月 31 日 23 时 59 分"}}
function makeNormal(){const data=deepClone(base);if(Math.random()>=.25){const pool=["cmd","direction","station","signal","method","time","missingWhole","missingContent"];const count=1+rand(3);shuffle(pool).slice(0,count).forEach(t=>applyError(data,t))}return data}
function makeChangeover(){const r=pick(routes),raw=[],count=2+rand(3),chosenTemplate=pick(changeoverTemplates);raw.push({key:"main-changeover",cmd:commandNo(),...mkTimes(),body:chosenTemplate(r.stations[1],r.dir)});if(Math.random()<.65){raw.push({key:"main-changeover",cmd:commandNo(),...mkTimes(),body:chosenTemplate(r.stations[2],r.dir)})}while(raw.length<count){const tpl=pick(changeoverTemplates);raw.push({key:"extra-"+raw.length,cmd:commandNo(),...mkTimes(),body:tpl(pick(r.stations.slice(1,-1)),r.dir)})}const seen=new Set(),items=raw.filter(it=>{if(seen.has(it.key))return false;seen.add(it.key);return true});const data={route:r.text,delivery:"交付日期：2021 年 1 月 1 日 0：00",valid:"有效时间至 2021 年 12 月 31 日 23：59 分",items};randomizeCorrectness(data,"changeover");return data}
function makeEquipment(){const r=pick(routes),count=1+rand(3),used=new Set(),items=[];while(items.length<count){const idx=rand(equipmentTemplates.length);if(used.has(idx)&&equipmentTemplates.length>count)continue;used.add(idx);items.push({cmd:commandNo(),...mkTimes(),body:equipmentTemplates[idx](pick(r.stations.slice(1,-1)),r.dir)})}const data={route:r.text,delivery:"交付日期：2021 年 1 月 1 日 0：00",valid:"有效时间至 2021 年 12 月 31 日 23：59 分",items};randomizeCorrectness(data,"equipment");return data}
function makeSpeed(){const r=pick(routes),count=1+rand(3),used=new Set(),items=[];while(items.length<count){const idx=rand(speedTemplates.length);if(used.has(idx)&&speedTemplates.length>count)continue;used.add(idx);items.push({cmd:commandNo(),...mkTimes(),body:speedTemplates[idx](pick(r.stations.slice(1,-1)),r.dir)})}const data={route:r.text,delivery:"交付日期：2021 年 1 月 1 日 0：00",valid:"有效时间至 2021 年 12 月 31 日 23：59 分",items};randomizeCorrectness(data,"speed");return data}
function randomizeCorrectness(data,kind){if(Math.random()<.25)return;const pool=[...genericErrorTypes];if(kind==="equipment")pool.push("equipmentMismatch");if(kind==="speed")pool.push("speedMismatch");if(kind==="changeover")pool.push("changeoverMismatch");const count=1+rand(2);shuffle(pool).slice(0,count).forEach(t=>applyError(data,t))}
function applyError(data,type){if(!data.items.length)return;const i=rand(data.items.length),it=data.items[i];if(type==="cmd")it.cmd=String(Number(it.cmd)+pick([1,7,10,21,100]));if(type==="direction"){if(Math.random()<.5){data.route=data.route.includes("下行")?data.route.replace("下行","上行"):data.route.replace("上行","下行")}else{it.body=it.body.includes("下行")?it.body.replaceAll("下行","上行"):it.body.replaceAll("上行","下行")}}if(type==="station")it.body=it.body.replace(/甲站|乙站|丙站|丁站|戊站|己站/,pick(["甲站","乙站","丙站","丁站","戊站","己站"]));if(type==="signal"){if(it.body.includes("出站信号机"))it.body=it.body.replace("出站信号机","进站信号机");else if(it.body.includes("进站信号机"))it.body=it.body.replace("进站信号机","出站信号机")}if(type==="method"){if(it.body.includes("绿色许可证"))it.body=it.body.replace("凭绿色许可证发车","凭路票发车");else if(it.body.includes("引导信号引导接车"))it.body=it.body.replace("使用引导信号引导接车","按正常方式接车进站");else if(it.body.includes("特定引导"))it.body=it.body.replace("按特定引导方式通过车站","按正常方式通过车站")}if(type==="time"){if(Math.random()<.5)data.valid="有效时间至 2021 年 12 月 30 日 23：59 分";else it.end="2021 年 12 月 31 日 22 时 59 分"}if(type==="missingWhole"){if(data.items.length>1)data.items.splice(i,1)}if(type==="missingContent"){let b=it.body;if(b.includes("，")){const p=b.lastIndexOf("，");it.body=b.slice(0,p)+"。"}else it.body=b.slice(0,Math.max(6,Math.floor(b.length*.6)))}if(type==="equipmentMismatch")it.body=pick(["该地点设备状态正常，无需采取任何特别措施。","该站设备施工已经结束，本条仍保留在揭示中。","与本趟列车运行进路无关的另一线路信号设备检修。"]);if(type==="speedMismatch"){if(/限速\d+/.test(it.body))it.body=it.body.replace(/限速\d+\s*km\/h/,"限速80 km/h");else if(it.body.includes("绿色许可证"))it.body=it.body.replace("绿色许可证","路票");else if(it.body.includes("引导信号引导接车"))it.body=it.body.replace("使用引导信号引导接车","按正常方式接车进站");else if(it.body.includes("特定引导"))it.body=it.body.replace("按特定引导方式通过车站","按正常方式通过车站");else it.body=it.body.replace("双机牵引","单机牵引")}if(type==="changeoverMismatch"){if(it.body.includes("V2.8"))it.body=it.body.replace("V2.8","V2.6");else if(it.body.includes("换装"))it.body=it.body.replace("换装","取消换装");else it.body+=" 版本号未标明。"}}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=rand(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function render(data){document.getElementById("route").textContent=data.route;document.getElementById("meta").innerHTML=`<span>${data.delivery}</span><span>${data.valid}</span>`;const box=document.getElementById("items");box.innerHTML="";data.items.forEach((it,index)=>{const p=document.createElement("p");p.className="item";const mark=document.createElement("span");mark.className="item-mark";mark.dataset.state="0";mark.title="点击：画圈 → 圈内打钩 → 清除";mark.addEventListener("click",cycleMark);const idx=document.createElement("span");idx.className="item-index";idx.textContent=(index+1)+"、";const text=document.createElement("span");text.className="item-text";text.innerHTML=`<span class="triangle">△</span>调度命令号 ${escapeHtml(it.cmd)} 号：${escapeHtml(it.start)}至${escapeHtml(it.end)}，${escapeHtml(it.body)}`;p.appendChild(mark);p.appendChild(idx);p.appendChild(text);box.appendChild(p)})}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[m])}
function cycleMark(e){e.stopPropagation();const el=e.currentTarget;let state=Number(el.dataset.state||0);state=(state+1)%3;el.dataset.state=String(state);el.classList.toggle("circled",state>=1);el.classList.toggle("checked",state===2)}
document.getElementById("paper").addEventListener("mouseup",()=>setTimeout(highlightSelection,0));document.getElementById("paper").addEventListener("touchend",()=>setTimeout(highlightSelection,50));
function highlightSelection(){const sel=window.getSelection();if(!sel||sel.rangeCount===0||sel.isCollapsed)return;const range=sel.getRangeAt(0),startEl=range.startContainer.nodeType===3?range.startContainer.parentElement:range.startContainer,endEl=range.endContainer.nodeType===3?range.endContainer.parentElement:range.endContainer,startItem=startEl&&startEl.closest?startEl.closest(".item-text"):null,endItem=endEl&&endEl.closest?endEl.closest(".item-text"):null;if(!startItem||startItem!==endItem){sel.removeAllRanges();return}if(startEl.closest&&startEl.closest("mark.student-highlight")&&endEl.closest&&endEl.closest("mark.student-highlight")){sel.removeAllRanges();return}try{const mark=document.createElement("mark");mark.className="student-highlight";const fragment=range.extractContents();mark.appendChild(fragment);range.insertNode(mark);sel.removeAllRanges();normalizeMarks(startItem)}catch(err){sel.removeAllRanges()}}
function normalizeMarks(root){const marks=[...root.querySelectorAll("mark.student-highlight")];marks.forEach(m=>{let next=m.nextSibling;if(next&&next.nodeType===1&&next.matches("mark.student-highlight")){while(next.firstChild)m.appendChild(next.firstChild);next.remove()}});root.normalize()}
function refreshWith(factory){const sheet=document.getElementById("sheet");sheet.classList.remove("refreshing");void sheet.offsetWidth;sheet.classList.add("refreshing");render(factory());closeDrawer()}
window.addEventListener("DOMContentLoaded",()=>refreshWith(makeNormal));
document.getElementById("generateBtn").addEventListener("click",()=>refreshWith(makeNormal));document.getElementById("changeoverBtn").addEventListener("click",()=>refreshWith(makeChangeover));document.getElementById("equipmentBtn").addEventListener("click",()=>refreshWith(makeEquipment));document.getElementById("speedBtn").addEventListener("click",()=>refreshWith(makeSpeed));
const drawer=document.getElementById("drawer"),handle=document.getElementById("drawerHandle");handle.addEventListener("click",e=>{e.stopPropagation();drawer.classList.toggle("open");handle.textContent=drawer.classList.contains("open")?"‹":"›"});function closeDrawer(){drawer.classList.remove("open");handle.textContent="›"}document.getElementById("workspace").addEventListener("mousedown",e=>{if(drawer.classList.contains("open")&&!e.target.closest(".drawer-handle"))closeDrawer()});
</script>

<script>

function batchHash32(str){
  let h=2166136261>>>0;
  str=String(str||"01").trim()||"01";
  for(let i=0;i<str.length;i++){
    h^=str.charCodeAt(i);
    h=Math.imul(h,16777619);
  }
  return h>>>0;
}
function batchRng(seed){
  let a=seed>>>0;
  return function(){
    a=(a+0x6D2B79F5)>>>0;
    let t=a;
    t=Math.imul(t^(t>>>15),t|1);
    t^=t+Math.imul(t^(t>>>7),t|61);
    return ((t^(t>>>14))>>>0)/4294967296;
  }
}
function batchShuffle(arr,rnd){
  arr=[...arr];
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(rnd()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
const BATCH_START="2021 年 1 月 1 日 0 时 0 分";
const BATCH_END="2021 年 12 月 31 日 23 时 59 分";
const BATCH_DELIVERY="2021年01月01日00时00分";

const BATCH_POOL_UP=[
  "通用线丁站上行进站色灯信号机故障，列车在丁站办理通过时按特定引导方式通过车站。",
  "通用线乙站至甲站区间线路施工，自K18+600至K20+200限速45 km/h。",
  "通用线丙站上行方向机车信号车载设备软件换装，出勤时核对设备版本标识。",
  "通用线戊站上行进站色灯信号机故障，列车在戊站办理停车接车时使用引导信号引导接车。",
  "通用线丁站至丙站区间自动闭塞设备施工，按施工期间规定的行车组织方式运行。",
  "通用线乙站上行方向2号道岔至站界施工，列车通过施工地段限速30 km/h。"
];
const BATCH_POOL_DOWN=[
  "通用线乙站至丙站区间线路施工，自K26+100至K31+500限速60 km/h。",
  "通用线丁站下行方向LKJ基础数据版本换装，出勤时核对数据版本、线路方向及交路范围。",
  "通用线丙站站内轨道电路设备检修，列车通过相关区段时按现场设备状态及调度命令执行。",
  "通用线丁站下行出站色灯信号机故障，丁站下行方向发车时凭绿色许可证发车。",
  "通用线戊站至己站区间受恶劣天气影响，自K42+300至K45+800限速45 km/h。",
  "通用线乙站下行方向列车运行监控装置相关数据文件换装，换装完成后核对版本标识。"
];

function makeBatchStandard(batchCode){
  const code=(String(batchCode||"01").trim()||"01").toUpperCase();
  if(code==="01" || code==="1"){
    return {
      code:"01",
      activeDir:"下行",
      route:"甲站至己站　下行",
      boardTitle:"甲站 —— 己站",
      up:[
        {cmd:"21011",dir:"上行",body:BATCH_POOL_UP[0]},
        {cmd:"21012",dir:"上行",body:BATCH_POOL_UP[1]},
        {cmd:"21013",dir:"上行",body:BATCH_POOL_UP[2]},
        {cmd:"21014",dir:"上行",body:BATCH_POOL_UP[4]}
      ],
      down:[
        {cmd:"21171",dir:"下行",body:"通用线丙站下行出站信号机施工，丙站下行方向凭绿色许可证发车。"},
        {cmd:"21172",dir:"下行",body:"通用线戊站下行进站色灯信号机故障，戊站办理停车接车时使用引导信号引导接车。"},
        {cmd:"21173",dir:"下行",body:BATCH_POOL_DOWN[0]},
        {cmd:"21174",dir:"下行",body:BATCH_POOL_DOWN[1]}
      ]
    };
  }
  const seed=batchHash32("TRAIN:"+code),rnd=batchRng(seed);
  const activeDir=rnd()<0.5?"上行":"下行";
  const base=21000+(seed%700);
  const upBodies=batchShuffle(BATCH_POOL_UP,rnd).slice(0,4);
  const downBodies=batchShuffle(BATCH_POOL_DOWN,rnd).slice(0,4);
  const up=upBodies.map((body,i)=>({cmd:String(base+i),dir:"上行",body}));
  const down=downBodies.map((body,i)=>({cmd:String(base+10+i),dir:"下行",body}));
  return {
    code,
    activeDir,
    route:activeDir==="下行"?"甲站至己站　下行":"己站至甲站　上行",
    boardTitle:"甲站 —— 己站",
    up,down
  };
}
function completeBatchItem(it){
  return {
    cmd:it.cmd,
    dir:it.dir,
    start:BATCH_START,
    end:BATCH_END,
    delivery:BATCH_DELIVERY,
    body:it.body,
    emphasis:[BATCH_START,BATCH_END],
    green:[it.dir],
    target:!!it.target,
    source:"batch"
  };
}
function makeStudentBatchPacket(batchCode,version){
  const std=makeBatchStandard(batchCode);
  const v=(String(version||"A").toUpperCase());
  const key=std.activeDir==="上行"?"up":"down";
  const opposite=std.activeDir==="上行"?"down":"up";
  let items=std[key].map(x=>completeBatchItem({...x,target:true}));
  const rnd=batchRng(batchHash32("STUDENT:"+std.code+":"+v));
  const idx=()=>Math.floor(rnd()*items.length);

  if(v==="A"){
    if(items.length){
      const i=idx();
      items[i].cmd=String(Number(items[i].cmd)+7);
      items[i]._trainingError="命令号不一致";
    }
    if(items.length>2){
      let j=idx();
      const removed=items.splice(j,1)[0];
    }
  }else if(v==="B"){
    if(items.length){
      const i=idx(),from=std.activeDir,to=std.activeDir==="上行"?"下行":"上行";
      items[i].body=items[i].body.includes(from)?items[i].body.replaceAll(from,to):items[i].body.replace("方向","反方向");
      items[i]._trainingError="方向或内容不一致";
    }
    const extra=completeBatchItem({...std[opposite][Math.floor(rnd()*std[opposite].length)],target:false});
    extra._trainingError="非本趟进路的多余揭示";
    items.push(extra);
  }else if(v==="C"){
    if(items.length){
      const i=idx();
      items[i].end="2021 年 12 月 31 日 22 时 59 分";
      items[i]._trainingError="有效时间不一致";
    }
    if(items.length>1){
      let j=idx();
      if(items[j]._trainingError && items.length>1) j=(j+1)%items.length;
      const b=items[j].body;
      const p=b.indexOf("，");
      items[j].body=p>8?b.slice(0,p)+"。":b.slice(0,Math.max(10,Math.floor(b.length*.58)));
      items[j]._trainingError="内容缺失";
    }
  }else{
    // D：完整正确版，便于教师演示
  }
  return {
    route:std.route,
    delivery:"交付日期：2021 年 1 月 1 日 0：00",
    valid:"有效时间至 2021 年 12 月 31 日 23：59 分",
    items,
    batch:std.code,
    version:v,
    activeDir:std.activeDir
  };
}


function generateLinkedStudentBatch(){
  const code=document.getElementById("batchCode").value.trim()||"01";
  const version=document.getElementById("studentVersion").value||"A";
  const packet=makeStudentBatchPacket(code,version);
  document.getElementById("batchCode").value=packet.batch;
  document.getElementById("batchStatus").textContent=`训练批次 ${packet.batch} · ${packet.version} · ${packet.activeDir}`;
  render(packet);
  closeDrawer();
}
document.getElementById("batchGenerateBtn").addEventListener("click",generateLinkedStudentBatch);
document.getElementById("batchCode").addEventListener("keydown",e=>{if(e.key==="Enter")generateLinkedStudentBatch()});
document.getElementById("studentVersion").addEventListener("change",generateLinkedStudentBatch);
window.addEventListener("DOMContentLoaded",()=>setTimeout(generateLinkedStudentBatch,0));
</script>
